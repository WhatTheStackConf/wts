name: Verification

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [test, check, typecheck, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.gate == 'test'
        run: pnpm pocketbase:download-test
      - run: pnpm generate:icons && pnpm exec velite
      - if: matrix.gate == 'build'
        run: pnpm build:all
      - if: matrix.gate == 'typecheck'
        run: pnpm typecheck:all
      - if: matrix.gate == 'check'
        run: pnpm check
      # Each integration worker starts real PocketBase processes. Serialize file
      # workers on hosted runners instead of racing their five-second budgets.
      - if: matrix.gate == 'test'
        run: pnpm test --no-file-parallelism
      - if: matrix.gate == 'test'
        run: pnpm test:site
      - if: matrix.gate == 'test'
        run: pnpm test:cfp
      - if: matrix.gate == 'test'
        run: pnpm test:mcs
      - if: matrix.gate == 'test'
        run: pnpm test:usability

  checkin-browser:
    name: Disposable Check-in browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pocketbase:download-test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:checkin-components
      - run: pnpm test:checkin-browser
      - run: pnpm test:checkin-lifecycle-browser
      - name: Verify signed-in workspaces and live Q&A in the built app
        run: pnpm test:workspace-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: checkin-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

  auth-acceptance:
    name: Shared auth acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y podman
      - run: pnpm --filter @wts/auth exec playwright install --with-deps chromium
      - run: pnpm pocketbase:download-test
      - run: pnpm --filter @wts/auth build
      - run: pnpm --filter @wts/auth acceptance
      - name: Verify the independent site's real OIDC boundary
        run: pnpm --filter @wts/site test:oidc
      - name: Verify the independent CFP's real OIDC boundary
        run: pnpm --filter @wts/cfp test:oidc
      - name: Build the independent CFP for browser acceptance
        run: pnpm --filter @wts/cfp build
      - name: Verify the built applicant workflow and recovery
        run: pnpm --filter @wts/cfp test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: auth-acceptance-failure
          path: |
            auth/acceptance/artifacts/
            cfp/acceptance/artifacts/
          retention-days: 3
          if-no-files-found: ignore
